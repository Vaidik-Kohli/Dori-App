<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operator Login – Dori</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="tailwind.config.js"></script>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800;900&display=swap" rel="stylesheet">

  <link rel="icon" type="image/png" href="logo.png">
</head>
<body class="bg-background dark:bg-background text-text antialiased min-h-screen flex flex-col items-center justify-center transition-colors duration-300">

  <div class="w-full max-w-md px-6">
    
    <!-- Logo Header -->
    <div class="flex flex-col items-center mb-8">
      <img src="logo.png" alt="Dori Logo" class="h-16 w-auto drop-shadow-sm rounded-2xl mb-4" />
      <h1 class="text-3xl font-black tracking-tight">Operator Login</h1>
      <p class="text-xs font-bold text-textMuted uppercase tracking-widest mt-1">Authorized Personnel Only</p>
    </div>

    <!-- Login Card -->
    <div class="bg-surface border-2 border-border rounded-[24px] p-8 shadow-sm">
      <h2 class="text-xl font-black mb-6 text-center">Operator Login</h2>
      
      <form onsubmit="handleLogin(event)" class="space-y-5">
        
        <div>
          <label class="block text-[10px] font-black uppercase tracking-widest text-textMuted mb-2">Operator ID</label>
          <input type="text" value="OP-10492" class="w-full bg-background border-2 border-border rounded-xl px-4 py-3 text-base font-bold transition-colors" required>
        </div>

        <div>
          <label class="block text-[10px] font-black uppercase tracking-widest text-textMuted mb-2">Password / Security Key</label>
          <input type="password" value="*********" class="w-full bg-background border-2 border-border rounded-xl px-4 py-3 text-base font-bold transition-colors tracking-widest" required>
        </div>

        <button type="submit" class="btn-tactile w-full h-[56px] rounded-[16px] bg-background dark:bg-surface text-onPrimary dark:text-text text-base font-black tracking-wide shadow-btn-3d flex items-center justify-center gap-3 mt-8">
          Authenticate &rarr;
        </button>
      </form>
      
    </div>
    
    <div class="mt-8 text-center">
      <a href="index.html" class="text-xs font-bold text-textMuted hover:text-primary transition-colors">&larr; Back to Portal</a>
    </div>

  </div>

  <script>
    function handleLogin(e) {
      e.preventDefault();
      // Dummy authentication logic: simply redirect to the operator dashboard
      localStorage.setItem('operatorAuth', 'true');
      window.location.href = 'operator-console.html';
    }

    // Apply theme on load based on localStorage
    (function init() {
      const savedTheme = localStorage.getItem('Dori-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      if (savedTheme === 'dark') {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>

  <!-- MOBILE BLOCKER -->
  <div id="mobileBlocker" class="fixed inset-0 z-[9999] bg-background text-onPrimary hidden flex-col items-center justify-center p-6 text-center">
    <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-emergency mb-6"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></svg>
    <h1 class="text-3xl font-black mb-4">Not Permitted</h1>
    <p class="text-lg text-textMuted font-medium max-w-sm mb-8">The Operator Console requires a desktop landscape environment. Please access this portal from a computer.</p>
    <a href="index.html" class="bg-surface text-text px-6 py-3 rounded-xl font-bold hover:bg-surface transition-colors">Return Home</a>
  </div>

</body>
</html>
