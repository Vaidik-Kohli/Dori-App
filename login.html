<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operator Login – Bharat Care</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Figtree', 'system-ui', 'sans-serif'],
          },
          colors: {
            bgLight: '#FAF9F6',
            bgDark: '#0A0A0A',
            surfaceLight: '#FFFFFF',
            surfaceDark: '#171717',
            borderLight: '#E5E5E5',
            borderDark: '#262626',
            primary: '#059669',
            blueUI: '#2563EB',
          },
          boxShadow: {
            'btn-3d': '0 4px 0 #000000, 0 10px 15px rgba(0,0,0,0.1)',
            'btn-3d-active': '0 0px 0 #000000, 0 2px 5px rgba(0,0,0,0.1)',
          }
        },
      },
    };
  </script>
  <style>
    /* Tactile button transition */
    .btn-tactile {
      transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.1s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-tactile:active {
      transform: translateY(4px);
      box-shadow: theme('boxShadow.btn-3d-active') !important;
    }
    .dark .btn-tactile {
      box-shadow: 0 4px 0 #FFFFFF, 0 10px 15px rgba(255,255,255,0.05);
    }
    .dark .btn-tactile:active {
      box-shadow: 0 0px 0 #FFFFFF, 0 2px 5px rgba(255,255,255,0.05) !important;
    }
    input:focus {
      outline: none;
      border-color: theme('colors.primary');
    }
  </style>
</head>
<body class="bg-bgLight dark:bg-bgDark text-[#171717] dark:text-[#F5F5F5] antialiased min-h-screen flex flex-col items-center justify-center transition-colors duration-300">

  <div class="w-full max-w-md px-6">
    
    <!-- Logo Header -->
    <div class="flex flex-col items-center mb-8">
      <div class="w-14 h-14 rounded-[16px] bg-primary flex items-center justify-center text-white mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
        </svg>
      </div>
      <h1 class="text-3xl font-black tracking-tight">Bharat Care</h1>
      <p class="text-xs font-bold text-slate-500 uppercase tracking-widest mt-1">Authorized Personnel Only</p>
    </div>

    <!-- Login Card -->
    <div class="bg-surfaceLight dark:bg-surfaceDark border-2 border-borderLight dark:border-borderDark rounded-[24px] p-8 shadow-sm">
      <h2 class="text-xl font-black mb-6 text-center">Operator Login</h2>
      
      <form onsubmit="handleLogin(event)" class="space-y-5">
        
        <div>
          <label class="block text-[10px] font-black uppercase tracking-widest text-slate-500 mb-2">Operator ID</label>
          <input type="text" value="OP-10492" class="w-full bg-bgLight dark:bg-[#1A1A1A] border-2 border-borderLight dark:border-borderDark rounded-xl px-4 py-3 text-base font-bold transition-colors" required>
        </div>

        <div>
          <label class="block text-[10px] font-black uppercase tracking-widest text-slate-500 mb-2">Password / Security Key</label>
          <input type="password" value="*********" class="w-full bg-bgLight dark:bg-[#1A1A1A] border-2 border-borderLight dark:border-borderDark rounded-xl px-4 py-3 text-base font-bold transition-colors tracking-widest" required>
        </div>

        <button type="submit" class="btn-tactile w-full h-[56px] rounded-[16px] bg-black dark:bg-white text-white dark:text-black text-base font-black tracking-wide shadow-btn-3d flex items-center justify-center gap-3 mt-8">
          Authenticate &rarr;
        </button>
      </form>
      
    </div>
    
    <div class="mt-8 text-center">
      <a href="index.html" class="text-xs font-bold text-slate-500 hover:text-primary transition-colors">&larr; Back to Portal</a>
    </div>

  </div>

  <script>
    function handleLogin(e) {
      e.preventDefault();
      // Dummy authentication logic: simply redirect to the operator dashboard
      localStorage.setItem('operatorAuth', 'true');
      window.location.href = 'operator-console.html';
    }

    // Apply theme on load based on localStorage
    (function init() {
      const savedTheme = localStorage.getItem('bharatcare-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      if (savedTheme === 'dark') {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>

  <!-- MOBILE BLOCKER -->
  <div id="mobileBlocker" class="fixed inset-0 z-[9999] bg-bgDark text-white hidden flex-col items-center justify-center p-6 text-center">
    <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-alert mb-6"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></svg>
    <h1 class="text-3xl font-black mb-4">Not Permitted</h1>
    <p class="text-lg text-slate-400 font-medium max-w-sm mb-8">The Operator Console requires a desktop landscape environment. Please access this portal from a computer.</p>
    <a href="index.html" class="bg-white text-black px-6 py-3 rounded-xl font-bold hover:bg-slate-200 transition-colors">Return Home</a>
  </div>
  <style>
    @media (max-width: 768px) {
      body > *:not(#mobileBlocker) { display: none !important; }
      #mobileBlocker { display: flex !important; }
    }
  </style>

</body>
</html>
